name: Bootstrap source

on:
  push:
    branches: [feature/android-shell]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source tree
        shell: bash
        run: |
          set -euo pipefail
          cat \
            bootstrap/chunk00.txt \
            bootstrap/chunk01.txt \
            bootstrap/chunk02-03.txt \
            bootstrap/chunk04-05.txt \
            bootstrap/chunk06.txt \
            bootstrap/chunk07.txt \
            bootstrap/chunk08.txt \
            bootstrap/chunk09.txt \
            | base64 -d > /tmp/xyz-source.tar.gz

          rm -rf bootstrap
          tar -xzf /tmp/xyz-source.tar.gz
          rm -f .github/workflows/bootstrap.yml
          rm -f BRANCHING.md REPOSITORY_READY.md docs/INITIALIZATION.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Übernehme v49-Basis mit Android-Hülle und Mehrplan-Kern"
          git push origin HEAD:feature/android-shell
