name: Portal-Fix 0.4.1 veröffentlichen

on:
  workflow_run:
    workflows:
      - "Prüfen, APK bauen und veröffentlichen"
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Nur für 0.4.1 aktiv
        id: gate
        shell: bash
        run: |
          if grep -q '"version": "0.4.1"' source/package.json; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.active == 'true'
        with:
          node-version-file: source/.nvmrc

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.active == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Tests
        if: steps.gate.outputs.active == 'true'
        working-directory: source
        run: |
          npm install --ignore-scripts
          npm run check

      - name: Android-Version 0.4.1 setzen
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/versionCode 5/versionCode 6/' source/android/app/build.gradle
          sed -i "s/versionName '0.4.0'/versionName '0.4.1'/" source/android/app/build.gradle
          grep -q 'versionCode 6' source/android/app/build.gradle
          grep -q "versionName '0.4.1'" source/android/app/build.gradle

      - name: Webassets synchronisieren
        if: steps.gate.outputs.active == 'true'
        working-directory: source
        run: npm run android:sync

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.active == 'true'
        with:
          gradle-version: '8.14.3'

      - name: APK bauen und prüfen
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle -p source/android :app:assembleDebug
          cp source/android/app/build/outputs/apk/debug/app-debug.apk xyz.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          CERT="$($APKSIGNER verify --verbose --print-certs xyz.apk)"
          grep -qi 'aaf3cf6b082dbf0b45bee2a1dabe78985726ae4a62769d1d79d4438d879317ea' <<<"$CERT"
          BADGING="$($AAPT dump badging xyz.apk)"
          grep -q "versionName='0.4.1'" <<<"$BADGING"
          grep -q "versionCode='6'" <<<"$BADGING"

      - name: Preview-Release auf 0.4.1 setzen
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release edit preview \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title 'xyz 0.4.1 Preview' \
            --notes 'version=0.4.1
          Portal-Login-Fix: Weiterleitungen werden ausschließlich innerhalb von https://virtueller-stundenplan.org sicher verfolgt. Andere Schulportale werden nicht unterstützt.' \
            --prerelease
          gh release upload preview xyz.apk --clobber --repo "$GITHUB_REPOSITORY"
