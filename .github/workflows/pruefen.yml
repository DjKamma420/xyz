name: Prüfen und APK bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-und-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_AVD_HOME: ${{ runner.temp }}/xyz-avd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: npm-Abhängigkeiten installieren
        run: npm install --ignore-scripts

      - name: Statische Prüfungen und Tests
        run: npm run check

      - name: Webassets für Android synchronisieren
        run: npm run android:sync

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android Debug APK bauen
        run: gradle -p android :app:assembleDebug

      - name: APK als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: xyz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: APK-Struktur, Signatur und Manifest prüfen
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -q "package: name='com.djkamma420.xyz.dev'" <<<"$BADGING"
          grep -q "application-label:'xyz'" <<<"$BADGING"
          sha256sum "$APK"

      - name: Android-Emulator vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd -f -n xyz-smoke -k "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee /tmp/xyz-avds.txt
          grep -qx 'xyz-smoke' /tmp/xyz-avds.txt
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: APK auf Emulator installieren und starten
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ADB="$ANDROID_HOME/platform-tools/adb"
          test -x "$ADB"
          "$ADB" start-server
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd xyz-smoke \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-metrics \
            >/tmp/xyz-emulator.log 2>&1 &
          EMULATOR_PID=$!

          if ! timeout 90 "$ADB" wait-for-device; then
            echo "Emulator wurde von adb nicht erkannt."
            cat /tmp/xyz-emulator.log
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi

          booted=0
          for _ in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator-Prozess wurde vor Abschluss des Boots beendet."
              cat /tmp/xyz-emulator.log
              exit 1
            fi
            sleep 2
          done
          if [ "$booted" != "1" ]; then
            echo "Android-Boot wurde nicht abgeschlossen."
            cat /tmp/xyz-emulator.log
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi

          "$ADB" install -r "$APK"
          "$ADB" shell am force-stop com.djkamma420.xyz.dev
          "$ADB" shell am start -W -n com.djkamma420.xyz.dev/.MainActivity | tee /tmp/xyz-launch.txt
          grep -Eq '^Status: ok$|^Complete$' /tmp/xyz-launch.txt
          test -n "$("$ADB" shell pidof com.djkamma420.xyz.dev | tr -d '\r')"
          "$ADB" shell dumpsys package com.djkamma420.xyz.dev | grep -q 'versionName=0.1.0'
          "$ADB" emu kill || true

      - name: Emulator-Log bei Fehler ausgeben
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/xyz-emulator.log ]; then tail -n 250 /tmp/xyz-emulator.log; fi
