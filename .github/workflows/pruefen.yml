name: Prüfen, APK bauen und veröffentlichen

on:
  push:
    paths-ignore:
      - 'xyz.apk'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-und-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: source/.nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: npm-Abhängigkeiten installieren
        working-directory: source
        run: npm install --ignore-scripts

      - name: Statische Prüfungen und Tests
        working-directory: source
        run: npm run check

      - name: Webassets für Android synchronisieren
        working-directory: source
        run: npm run android:sync

      - name: Nativen Updater im Android-Build prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<script src="updater.js"></script>' source/android/app/src/main/assets/public/index.html
          grep -q 'registerPlugin(UpdatePlugin.class)' source/android/app/src/main/java/com/djkamma420/xyz/dev/MainActivity.java
          grep -q 'REQUEST_INSTALL_PACKAGES' source/android/app/src/main/AndroidManifest.xml

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android Debug APK bauen
        run: gradle -p source/android :app:assembleDebug

      - name: Fertige Application bereitstellen
        run: cp source/android/app/build/outputs/apk/debug/app-debug.apk xyz.apk

      - name: APK als Actions-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: xyz-apk
          path: xyz.apk
          if-no-files-found: error
          retention-days: 30

      - name: APK-Struktur, feste Preview-Signatur und Manifest prüfen
        shell: bash
        run: |
          set -euo pipefail
          APK=xyz.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          CERT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERT"
          grep -qi 'aaf3cf6b082dbf0b45bee2a1dabe78985726ae4a62769d1d79d4438d879317ea' <<<"$CERT"
          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -q "package: name='com.djkamma420.xyz.dev'" <<<"$BADGING"
          grep -q "application-label:'xyz'" <<<"$BADGING"
          grep -q "versionName='0.3.0'" <<<"$BADGING"
          grep -q "versionCode='3'" <<<"$BADGING"
          sha256sum "$APK"

      - name: Android-Emulator vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          AVD_HOME="$RUNNER_TEMP/xyz-avd"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$AVD_HOME"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd -f -n xyz-smoke -k "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx 'xyz-smoke'
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: APK auf Emulator installieren, aktualisieren und starten
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          APK=xyz.apk
          ADB="$ANDROID_HOME/platform-tools/adb"
          test -n "${ANDROID_AVD_HOME:-}"
          test -x "$ADB"
          "$ADB" start-server
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd xyz-smoke \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-metrics \
            >/tmp/xyz-emulator.log 2>&1 &
          EMULATOR_PID=$!
          if ! timeout 90 "$ADB" wait-for-device; then
            cat /tmp/xyz-emulator.log
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi
          booted=0
          for _ in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat /tmp/xyz-emulator.log; exit 1; fi
            sleep 2
          done
          if [ "$booted" != "1" ]; then cat /tmp/xyz-emulator.log; kill "$EMULATOR_PID" 2>/dev/null || true; exit 1; fi
          "$ADB" install "$APK"
          "$ADB" install -r "$APK"
          "$ADB" shell am force-stop com.djkamma420.xyz.dev
          "$ADB" shell am start -W -n com.djkamma420.xyz.dev/.MainActivity | tee /tmp/xyz-launch.txt
          grep -Eq '^Status: ok$|^Complete$' /tmp/xyz-launch.txt
          test -n "$("$ADB" shell pidof com.djkamma420.xyz.dev | tr -d '\r')"
          "$ADB" shell dumpsys package com.djkamma420.xyz.dev | grep -q 'versionName=0.3.0'
          "$ADB" emu kill || true

      - name: Emulator-Log bei Fehler ausgeben
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/xyz-emulator.log ]; then tail -n 250 /tmp/xyz-emulator.log; fi

  github-application:
    name: Fertige Application auf GitHub aktualisieren
    needs: test-und-android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Geprüfte APK laden
        uses: actions/download-artifact@v4
        with:
          name: xyz-apk
          path: .

      - name: xyz.apk im Main-Root aktualisieren
        shell: bash
        run: |
          set -euo pipefail
          test -s xyz.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f xyz.apk
          if git diff --cached --quiet; then
            echo 'xyz.apk ist bereits aktuell.'
          else
            git commit -m 'Aktualisiere installierbare xyz.apk auf 0.3.0'
            git push origin HEAD:main
          fi

      - name: Feste Preview-Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit preview \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title 'xyz 0.3.0 Preview' \
              --notes 'version=0.3.0\nInstallierbare Android-Preview mit In-App-Updater. Dieselbe geprüfte APK liegt zusätzlich als xyz.apk direkt im Main-Root. Preview-Signierung; kein Play-Store-Release.' \
              --prerelease
            gh release upload preview xyz.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create preview xyz.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title 'xyz 0.3.0 Preview' \
              --notes 'version=0.3.0\nInstallierbare Android-Preview mit In-App-Updater. Dieselbe geprüfte APK liegt zusätzlich als xyz.apk direkt im Main-Root. Preview-Signierung; kein Play-Store-Release.' \
              --prerelease
          fi
