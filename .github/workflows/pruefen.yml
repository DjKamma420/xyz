name: Prüfen und APK bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-und-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: npm-Abhängigkeiten installieren
        run: npm install --ignore-scripts

      - name: Statische Prüfungen und Tests
        run: npm run check

      - name: Webassets für Android synchronisieren
        run: npm run android:sync

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android Debug APK bauen
        run: gradle -p android :app:assembleDebug

      - name: APK als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: xyz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
